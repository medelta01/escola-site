<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>document.documentElement.classList.add('preload');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETE Luiz Alves Lacerda — Gerenciar Notícias</title>
  <meta name="description" content="Gerencie as notícias do site.">

  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="js/supabase-config.js" defer></script>
  <script src="js/session.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
</head>
<body>

  <header class="site-header" data-header>
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="assets/img/logo.png" alt="ETE Luiz Alves Lacerda">
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <ul class="nav__list">
          <li><a href="index.html" class="nav__link">Início</a></li>
          <li><a href="cursos.html" class="nav__link">Cursos</a></li>
          <li><a href="noticias.html" class="nav__link">Notícias</a></li>
          <li><a href="contato.html" class="nav__link">Contato</a></li>
          <li id="nav-admin" style="display:none"><a href="admin.html" class="nav__link">Painel</a></li>
          <li id="nav-auth"><a href="login.html" class="nav__link">Entrar</a></li>
        </ul>
      </nav>
      <button class="nav__toggle" aria-label="Abrir menu" data-nav-toggle>
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 class="page-hero__title">Gerenciar Notícias</h1>
        <p class="page-hero__subtitle">Crie, edite ou remova notícias do site.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">

        <div class="profile-card" data-reveal style="max-width:100%; margin-bottom: var(--space-lg);">
          <h3 id="form-titulo-secao">Nova notícia</h3>

          <form id="form-noticia" novalidate>
            <input type="hidden" id="noticia-id">

            <div class="form-field">
              <label for="n-titulo">Título</label>
              <input type="text" id="n-titulo" required>
            </div>

            <div class="form-field">
              <label for="n-resumo">Resumo (aparece na listagem)</label>
              <textarea id="n-resumo" rows="2" required></textarea>
            </div>

            <div class="form-field">
              <label for="n-conteudo">Conteúdo completo</label>
              <textarea id="n-conteudo" rows="8" required></textarea>
            </div>

            <div class="form-field">
              <label for="n-imagem">Imagem (opcional)</label>
              <input type="file" id="n-imagem" accept="image/*">
            </div>

            <div class="form-field">
              <label for="n-video">Link de vídeo (opcional, ex: YouTube)</label>
              <input type="url" id="n-video" placeholder="https://youtube.com/...">
            </div>

            <p class="auth-error" id="n-erro"></p>
            <p class="auth-success" id="n-sucesso"></p>

            <div class="profile-edit-actions">
              <button type="button" class="btn btn--ghost" id="btn-cancelar-edicao" style="display:none;">cancelar edição</button>
              <button type="submit" class="btn btn--primary" id="btn-salvar-noticia">Publicar</button>
            </div>
          </form>
        </div>

        <h2 class="section__title" style="text-align:left;">Notícias publicadas</h2>
        <div id="lista-noticias" class="pending-list"></div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer__inner">
      <p>&copy; <span data-year></span> ETE Luiz Alves Lacerda. Todos os direitos reservados.</p>
    </div>
  </footer>

  <script src="js/gerenciar-noticias.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
